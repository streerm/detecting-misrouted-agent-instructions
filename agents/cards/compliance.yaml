id: compliance
name: Compliance agent
description: Checks requests against desk policy and the restricted list; the only agent that may approve.
role: specialist
parent: router
capability:
  intents: [check_compliance, approve_trade]
  inputs: [instruction, ticker, requester]
  outputs: [decision_with_reason]
context_scope:
  domains: [compliance]
  data_sources: []
  out_of_scope: [live_prices, sec_filings, macro_series]
authority:
  level: approve
  may: [approve_trade, reject_trade]
  may_not: [place_order, send_external]
skills: []
tools: []
model: default
