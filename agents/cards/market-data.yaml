id: market-data
name: Market data agent
description: Live and historical prices, fundamentals and FX for listed securities.
role: specialist
parent: router
capability:
  intents: [get_price, get_fundamentals]
  inputs: [ticker, date_range, currency]
  outputs: [table, time_series]
context_scope:
  domains: [market_data]
  data_sources: [alpha_vantage]
  periods: "trading days; as-of timestamp required"
  out_of_scope: [sec_filings, macro_series, backtests]
authority:
  level: read_only
  may: [read_market_data]
  may_not: [place_order, approve_trade, send_external]
skills: [finance-research-rules]
tools: [alpha_vantage]
model: default
