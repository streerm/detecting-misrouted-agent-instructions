[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misroute"
version = "0.1.0"
description = "Detecting misrouted instructions in hierarchical, model-agnostic agent systems"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]          # also covers Ollama, vLLM, LM Studio, Together, Groq
dev = ["pytest>=8"]
all = ["anthropic>=0.40", "openai>=1.40", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
