# Data sources agents may be scoped to (context_scope.data_sources in cards).
# "connect" says how a human connects it; agents get access only via tools listed in their card.
sec_edgar:
  gives: US filings (10-K, 10-Q, 8-K, DEF 14A) and XBRL financials
  connect: MCP server 'edgartools' in .mcp.json (edgartools-mcp, open source); set EDGAR_IDENTITY in .env
  cost: free
alpha_vantage:
  gives: prices, fundamentals, earnings, FX, commodities, macro, news sentiment
  connect: MCP server 'alphavantage' in .mcp.json (official local server, PyPI marketdata-mcp-server 0.3.1, MIT; exposes TOOL_LIST / TOOL_GET / TOOL_CALL over ~120 functions); ALPHAVANTAGE_API_KEY in .env
  cost: free key (rate-limited)
finnhub:
  gives: quotes, company news and sentiment, estimates, ownership, calendars
  connect: MCP server 'finnhub' in .mcp.json (community, PyPI mcp-finnhub 1.1.1 by Rob Sherman, MIT; not built by Finnhub); FINNHUB_API_KEY in .env
  cost: free key (60 calls/minute)
fred:
  gives: 800,000+ macro series (rates, CPI, GDP)
  connect: MCP server 'fred' in .mcp.json (npm fred-mcp-server by Stefano Amorelli, AGPL-3.0); FRED_API_KEY in .env
  cost: free key
companies_house:
  gives: UK company accounts, officers, persons with significant control
  connect: MCP server 'companies_house' in .mcp.json (ours, mcp_servers/companies_house.py, read-only); COMPANIES_HOUSE_API_KEY in .env
  cost: free key
dbnomics:
  gives: non-US macro series from ECB, Eurostat, BoE, OECD, IMF and other providers
  connect: MCP server 'dbnomics' in .mcp.json (ours, mcp_servers/dbnomics.py)
  cost: free, no key
arxiv:
  gives: research paper search and abstracts
  connect: MCP server 'arxiv' in .mcp.json (ours, mcp_servers/arxiv.py); no agent card uses it yet
  cost: free, no key
ofac_sdn:
  gives: US Treasury sanctions list (SDN) name screening
  connect: MCP server 'sanctions' in .mcp.json (ours, mcp_servers/sanctions.py); list cached daily
  cost: free, no key
web_search:
  gives: news, press releases, RNS
  connect: model's built-in search, or a search tool
  cost: varies
internal_backtests:
  gives: results of the team's own backtests
  connect: MCP server 'backtest' in .mcp.json (ours, mcp_servers/backtest.py); results saved under runs/backtests/
  cost: none
# Rules: check who built any community server; keys in .env only; filings beat news when they disagree.
